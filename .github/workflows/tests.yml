name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installs matplotlib/numpy as well as pytest. Those are only needed by
      # releases.py's chart path, but without them the releases.py regression
      # tests skip instead of running -- and those are what prove the shared
      # GitHub helpers were moved, not reimplemented.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
